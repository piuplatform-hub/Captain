# =====================================================================
# CẤU HÌNH TMUX TỐI ƯU CHO LẬP TRÌNH VIÊN (VIM-STYLE)
# =====================================================================

# 1. Hỗ trợ màu sắc hiển thị đúng chuẩn TrueColor (256 colors)
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*256col*:Tc"

# 2. Bắt đầu đánh số Window và Pane từ 1 thay vì 0 (tiện với tay bấm phím số)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 3. Bật chuột (cuộn trang, click chọn pane, kéo đổi kích thước pane)
set -g mouse on

# 4. Phím chia màn hình trực quan
# Prefix + | : Chia đôi Trái / Phải
# Prefix + - : Chia đôi Trên / Dưới
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 5. Di chuyển giữa các pane mượt mà theo chuẩn phím Vim (h, j, k, l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 6. Điều chỉnh kích thước pane (Prefix + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 7. Phím nạp lại (reload) cấu hình nhanh bằng Prefix + r
bind r source-file ~/.tmux.conf \; display-message " Đã nạp lại cấu hình tmux!"

# 8. Tăng bộ nhớ đệm cuộn dòng (scrollback buffer)
set -g history-limit 10000

# 9. Giảm độ trễ khi bấm phím Esc (rất quan trọng khi dùng Neovim trong tmux)
set -s escape-time 0
